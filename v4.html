<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aylan — Parcours personnalisé V4 🚀</title>
<style>
:root{--ink:#203b4c;--sky:#62c7e8;--blue:#238bc1;--green:#62c978;--red:#f06b62;--yellow:#ffd15c;--bg:#f4fafd}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--sky) 0 190px,var(--bg) 190px);min-height:100vh}
header{text-align:center;color:#fff;padding:28px 15px 52px}h1{margin:0;font-size:clamp(2rem,7vw,3rem)}main{max-width:980px;margin:-24px auto 40px;padding:0 14px}.panel{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 18px #203b4c18}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid,.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{border:0;border-radius:18px;padding:20px;background:#fff;box-shadow:0 5px 15px #203b4c18;cursor:pointer;color:var(--ink);font:inherit;text-align:left}.card span{font-size:2.2rem}.card b{display:block;font-size:1.1rem;margin:8px 0}.skill{background:var(--bg);padding:14px;border-radius:14px}.bar{height:9px;background:#dceaf2;border-radius:8px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--green)}button{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer;font-size:1rem}.secondary{background:#e7edf1;color:var(--ink)}.hidden{display:none!important}.quiz{text-align:center}.emoji{font-size:4rem}.choices{display:grid;gap:12px;max-width:600px;margin:20px auto}.choice{background:var(--bg);color:var(--ink);border:3px solid #dceaf2}.choice.correct{background:#e4f8e8!important;border-color:var(--green)!important}.choice.wrong{background:#fdeaea!important;border-color:var(--red)!important}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7edf1;font-size:.85rem;margin:2px}.good{background:#e4f8e8}.warn{background:#fff4ce}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.feedback{font-size:1.1rem;min-height:28px}.small{color:#587383;font-size:.92rem}.mission{border-left:6px solid var(--yellow);background:#fffaf0;padding:14px;border-radius:12px}.danger{color:var(--red)}footer{text-align:center;padding:20px;color:#6e8698}
</style></head>
<body>
<header><h1>Les aventures d’Aylan 🚀</h1><p>V4 — ton parcours s’adapte à toi</p></header>
<main>
<section class="panel top"><strong>⭐ <span id="stars">0</span></strong><span>Réponses : <b id="done">0</b></span><button id="back" class="secondary">⬅ V3.1</button></section>
<section class="panel"><h2>📊 Mon profil</h2><div id="profile" class="skills"></div></section>
<section class="panel"><h2>🎯 Mission intelligente</h2><div id="mission" class="mission"></div><div class="actions"><button id="missionBtn">Commencer 🚀</button></div></section>
<section id="home" class="grid"></section>
<section id="quiz" class="panel hidden"><div class="top"><span id="progress"></span><span id="level"></span><button id="quit" class="secondary">⬅ Retour</button></div><div id="question" class="quiz"></div><div class="actions"><button id="next" class="hidden">Suivant ➜</button></div></section>
</main><footer>V4 — apprendre, pratiquer, réussir ❤️</footer>
<script>
'use strict';
const SK={addition:'Addition',soustraction:'Soustraction',suites:'Suites',comparaison:'Comparaison',mots_ar:'Mots arabes',lettres_ar:'Lettres arabes',vocab_ar:'Vocabulaire arabe',mots_fr:'Mots français',lecture_fr:'Lecture française',vocab_fr:'Vocabulaire français',mots_en:'Mots anglais',couleurs_en:'Couleurs anglaises',comprehension_en:'Compréhension anglaise',logique:'Logique'};
const CAT={evaluation:['📋','Évaluation','Toutes les compétences'],calcul:['🔢','Calcul','Nombres et opérations'],arabe:['📖','العربية','حروف وكلمات'],francais:['📚','Français','Mots et lecture'],anglais:['🔤','English','Words and colors'],logique:['🧩','Logique','Réfléchir']};
const AR=[['🐱','Choisis « chat »','قطة','كلب','بيت'],['☀️','Choisis « soleil »','قمر','شمس','نجمة'],['🏠','Choisis « maison »','شجرة','باب','بيت'],['✏️','Première lettre de « قلم »','ق','ل','م']];
const FR=[['🐱','Choisis le bon mot','chat','chien','oiseau'],['☀️','Choisis le bon mot','lune','soleil','étoile'],['🔤','Première lettre de « livre »','l','v','b']];
const EN=[['🐱','Choose the right word','dog','cat','bird'],['🔴','What color is this?','blue','green','red'],['🍎','What is this?','apple','house','car']];
const $=id=>document.getElementById(id);const el={stars:$('stars'),done:$('done'),profile:$('profile'),mission:$('mission'),missionBtn:$('missionBtn'),home:$('home'),quiz:$('quiz'),progress:$('progress'),level:$('level'),question:$('question'),next:$('next'),quit:$('quit')};
let state={skills:{},stars:0,done:0};try{state=JSON.parse(localStorage.getItem('aylanV4')||'{}')}catch{};state.skills??={};state.stars??=0;state.done??=0;
function today(){return new Date().toISOString().slice(0,10)}
function ensure(k){return state.skills[k]??={attempts:0,correct:0,recent:[],streak:0,bestStreak:0,last:null,due:null,errorTypes:{}}}
function score(k){const s=ensure(k), acc=s.attempts?100*s.correct/s.attempts:0;const recent=s.recent.length?100*s.recent.filter(Boolean).length/s.recent.length:0;const consistency=s.bestStreak>=3?10:s.bestStreak===2?5:0;return Math.round(Math.min(100,acc*.75+recent*.15+consistency))}
function level(k){const p=score(k);return p<40?1:p<60?2:p<80?3:4}
function levelName(n){return ['','🔴 Découverte','🟠 En progression','🟡 Maîtrise','🟢 Avancé'][n]}
function save(){localStorage.setItem('aylanV4',JSON.stringify(state))}
function render(){el.stars.textContent=state.stars;el.done.textContent=state.done;el.profile.innerHTML=Object.entries(SK).map(([k,n])=>{const s=ensure(k),p=score(k),l=level(k);return `<div class="skill"><b>${n}</b><div><span class="tag">${levelName(l)}</span><span class="tag">${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="small">${s.attempts} essais · ${s.correct} réussites</div></div>`}).join('');
const weak=chooseSkill();const w=ensure(weak);el.mission.innerHTML=`<b>${SK[weak]}</b> — ${levelName(level(weak))}<br><span class="small">${reason(weak)} ${w.due&&w.due<=today()?'Une révision est due aujourd’hui.':''}</span>`}
function chooseSkill(){const keys=Object.keys(SK);return keys.sort((a,b)=>{const A=ensure(a),B=ensure(b),pa=score(a),pb=score(b);const dueA=A.due&&A.due<=today()? -15:0,dueB=B.due&&B.due<=today()?-15:0;return pa+dueA-(pb+dueB)})[0]}
function reason(k){const s=ensure(k);if(!s.attempts)return 'Cette compétence n’a pas encore été explorée.';if(s.recent.length>=3&&s.recent.slice(-3).filter(Boolean).length===0)return 'On va refaire quelques exercices très simples pour reconstruire la confiance.';if(score(k)<60)return 'On va consolider les bases avec des exercices adaptés.';if(score(k)<80)return 'Tu progresses bien : on va mélanger les exercices.';return 'Tu maîtrises bien : on augmente doucement la difficulté.'}
function makeMath(k,l){let a,b,ans,text,emoji='🔢';if(k==='addition'){const max=[10,15,30,50][l-1];a=rand(0,max);b=rand(0,max-a);ans=a+b;text=`${a} + ${b} = ?`;emoji='➕'}else if(k==='soustraction'){const max=[10,15,30,50][l-1];a=rand(1,max);b=rand(0,a);ans=a-b;text=`${a} − ${b} = ?`;emoji='➖'}else if(k==='suites'){const start=rand(1,[10,20,50,100][l-1]);const step=rand(1,l===1?2:l===2?3:5);ans=start+step;text=`${start}, ${start+step}, ${start+2*step}, ?`;emoji='🔢'}else{const a=rand(1,[20,50,100,200][l-1]),b=rand(1,[20,50,100,200][l-1]);ans=Math.max(a,b);text='Quel est le plus grand ?';return {emoji,text,choices:shuffle([String(a),String(b),String(Math.max(1,ans-rand(1,5))) ]),answer:String(ans),kind:'comparison'} }return {emoji,text,choices:choicesFor(ans,l),answer:String(ans),kind:k}}
function choicesFor(ans,l){const vals=new Set([ans]);const deltas=l===1?[1,-1,2]:l===2?[1,-1,2,-2,3]:[1,-1,2,-2,5];while(vals.size<3){const d=deltas[rand(0,deltas.length-1)];if(ans+d>=0)vals.add(ans+d)}return shuffle([...vals].map(String))}
function language(arr,skill){const q=arr[rand(0,arr.length-1)];return {emoji:q[0],text:q[1],choices:[q[2],q[3],q[4]],answer:q[2],kind:skill}}
function logic(l){const step=l>=3?rand(2,4):1;const start=rand(1,10);const ans=start+step*3;return {emoji:'🧩',text:`${start}, ${start+step}, ${start+step*2}, ?`,choices:choicesFor(ans,l),answer:String(ans),kind:'logique'}}
function gen(k){const l=level(k);if(['addition','soustraction','suites','comparaison'].includes(k))return makeMath(k,l);if(k==='mots_ar'||k==='lettres_ar'||k==='vocab_ar')return language(AR,k);if(k==='mots_fr'||k==='lecture_fr'||k==='vocab_fr')return language(FR,k);if(k==='mots_en'||k==='couleurs_en'||k==='comprehension_en')return language(EN,k);return logic(l)}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){return a.sort(()=>Math.random()-.5)}
function build(cat){let keys;if(cat==='evaluation')keys=Object.keys(SK);else if(cat==='calcul')keys=['addition','soustraction','suites','comparaison'];else if(cat==='arabe')keys=['mots_ar','lettres_ar','vocab_ar'];else if(cat==='francais')keys=['mots_fr','lecture_fr','vocab_fr'];else if(cat==='anglais')keys=['mots_en','couleurs_en','comprehension_en'];else keys=['logique'];return shuffle([...keys]).slice(0,cat==='evaluation'?14:Math.min(6,keys.length)).map(k=>({...gen(k),skill:k}))}
let quiz=[],qi=0,qscore=0,current=null;
function start(cat,forcedSkill=null){quiz=forcedSkill?[...Array(6)].map(()=>{const x=gen(forcedSkill);return {...x,skill:forcedSkill}}):build(cat);qi=0;qscore=0;el.home.classList.add('hidden');el.quiz.classList.remove('hidden');show()}
function show(){current=quiz[qi];el.progress.textContent=`Question ${qi+1} / ${quiz.length}`;el.level.textContent=levelName(level(current.skill));el.question.innerHTML=`<div class="emoji">${current.emoji}</div><h2>${current.text}</h2><div class="choices">${shuffle(current.choices.map((x,i)=>({x,i}))).map(o=>`<button class="choice" data-x="${escapeHtml(o.x)}">${o.x}</button>`).join('')}</div><div id="feedback" class="feedback"></div>`;el.next.classList.add('hidden');el.question.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.x),{once:true}))}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function answer(value){const q=current,ok=String(value)===String(q.answer),s=ensure(q.skill);if(ok)qscore++;s.attempts++;if(ok){s.correct++;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak)}else{s.streak=0;const type=errorType(q,value);s.errorTypes[type]=(s.errorTypes[type]||0)+1}s.recent=(s.recent||[]).concat(ok).slice(-8);s.last=new Date().toISOString();s.due=nextReview(score(q.skill),ok);state.done++;if(ok)state.stars+=2;save();el.question.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(String(b.dataset.x)===String(q.answer))b.classList.add('correct');if(String(b.dataset.x)===String(value)&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?feedbackGood(s):feedbackWrong(q,s);el.next.classList.remove('hidden');render();try{await fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:q.skill,subject:'v4',question:q.text,answer:value,correctAnswer:q.answer,correct:ok,difficulty:level(q.skill),errorType:ok?null:errorType(q,value),engine:'v4'})})}catch(e){}}
function errorType(q,value){if(['addition','soustraction'].includes(q.kind)&&Number.isFinite(Number(value)))return Math.abs(Number(value)-Number(q.answer))===1?'calcul_proche':'calcul_ecart';if(q.kind==='logique'||q.kind==='suites')return 'suite_ou_regle';return 'vocabulaire'}
function nextReview(p,ok){const d=new Date();let days;if(!ok||p<40)days=1;else if(p<60)days=2;else if(p<80)days=4;else days=7;d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function feedbackGood(s){if(s.streak>=3)return '🔥 Série de réussites ! On peut bientôt augmenter la difficulté.';return '🎉 Bravo ! Ta progression est enregistrée.'}
function feedbackWrong(q,s){return `💪 Pas grave. La bonne réponse est ${q.answer}. On gardera cette compétence en priorité pour la suite.`}
function home(){el.home.innerHTML=Object.entries(CAT).map(([k,v])=>`<button class="card" data-cat="${k}"><span>${v[0]}</span><b>${v[1]}</b><small>${v[2]}</small></button>`).join('');el.home.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.cat)))}
el.next.addEventListener('click',()=>{qi++;if(qi<quiz.length){show()}else{el.question.innerHTML=`<div class="emoji">🏆</div><h2>Bravo !</h2><p>Tu as terminé cette série.</p><p><b>${qscore} / ${quiz.length}</b> bonnes réponses</p><div class="actions"><button id="again">Recommencer</button><button id="homeAgain" class="secondary">Retour</button></div>`;el.next.classList.add('hidden');$('again').addEventListener('click',()=>start('mission',chooseSkill()));$('homeAgain').addEventListener('click',()=>location.reload())}});
$('missionBtn').addEventListener('click',()=>start('mission',chooseSkill()));el.quit.addEventListener('click',()=>location.reload());$('back').addEventListener('click',()=>location.href='/');home();render();
</script></body></html>
