<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aylan — V4 audit fix</title><style>
body{font-family:Arial,sans-serif;background:#f4fafd;color:#203b4c;margin:0}header{background:#62c7e8;color:#fff;text-align:center;padding:25px}main{max-width:900px;margin:20px auto;padding:15px}.panel{background:#fff;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 5px 18px #203b4c18}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,button{border:0;border-radius:14px;padding:15px;cursor:pointer;font-size:1rem}.card{background:#fff;box-shadow:0 4px 14px #203b4c18;text-align:left}.choices{display:grid;gap:12px;max-width:600px;margin:20px auto}.choice{background:#f4fafd;border:3px solid #dceaf2;color:#203b4c}.correct{background:#e4f8e8!important;border-color:#62c978!important}.wrong{background:#fdeaea!important;border-color:#f06b62!important}.hidden{display:none}.emoji{font-size:4rem;text-align:center}.center{text-align:center}.secondary{background:#e7edf1}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7edf1;margin:3px}.feedback{min-height:30px;text-align:center;font-size:1.1rem}
</style></head><body><header><h1>Les aventures d’Aylan 🚀</h1><p>V4 — version auditée</p></header><main>
<section id="home" class="panel"><h2>Choisis une activité</h2><div id="cats" class="grid"></div><p class="center"><button id="audit" class="secondary">🔍 Audit automatique</button></p><div id="auditResult"></div></section>
<section id="quiz" class="panel hidden"><div><span id="progress"></span> · <span id="skill"></span><button id="quit" class="secondary" style="float:right">⬅ Retour</button></div><div id="question"></div><p id="feedback" class="feedback"></p><p class="center"><button id="next" class="hidden">Suivant ➜</button></p></section></main>
<script>
'use strict';
const BANK={
addition:[['➕','27 + 18 = ?',45],['➕','9 + 6 = ?',15],['➕','14 + 5 = ?',19],['➕','23 + 17 = ?',40]],
soustraction:[['➖','42 − 18 = ?',24],['➖','15 − 7 = ?',8],['➖','30 − 12 = ?',18],['➖','50 − 25 = ?',25]],
suites:[['🔢','2, 4, 6, 8, ?',10],['🔢','5, 10, 15, 20, ?',25],['🔢','3, 6, 9, 12, ?',15],['🔢','10, 20, 30, 40, ?',50]],
comparaison:[['🔎','Quel est le plus grand : 7 ou 12 ?',12],['🔎','Quel est le plus grand : 25 ou 18 ?',25],['🔎','Quel est le plus grand : 43 ou 34 ?',43],['🔎','Quel est le plus grand : 9 ou 6 ?',9]],
mots_ar:[['🐱','Choisis « chat »',['قطة','كلب','بيت'],'قطة'],['☀️','Choisis « soleil »',['قمر','شمس','نجمة'],'شمس'],['🏠','Choisis « maison »',['شجرة','باب','بيت'],'بيت']],
lettres_ar:[['✏️','Première lettre de « قلم »',['ق','ل','م'],'ق'],['📖','Première lettre de « كتاب »',['ك','ت','ب'],'ك'],['🏠','Première lettre de « بيت »',['ب','ي','ت'],'ب']],
vocab_ar:[['🍎','Quel mot signifie « pomme » ?',['تفاحة','سيارة','باب'],'تفاحة'],['🚗','Quel mot signifie « voiture » ?',['بيت','سيارة','قلم'],'سيارة'],['📚','Quel mot signifie « livre » ?',['كتاب','كرسي','شمس'],'كتاب']],
mots_fr:[['🐱','Choisis le bon mot',['chat','chien','oiseau'],'chat'],['☀️','Choisis le bon mot',['lune','soleil','étoile'],'soleil'],['🍎','Choisis le bon mot',['pomme','maison','voiture'],'pomme']],
lecture_fr:[['🔤','Première lettre de « livre »',['l','v','b'],'l'],['🔤','Première lettre de « maison »',['m','n','s'],'m'],['🔤','Première lettre de « bateau »',['b','d','p'],'b']],
vocab_fr:[['🍎','Quel mot désigne ce fruit ?',['pomme','chaise','table'],'pomme'],['🐶','Quel mot désigne cet animal ?',['chien','livre','porte'],'chien'],['🚗','Quel mot désigne ce véhicule ?',['voiture','maison','arbre'],'voiture']],
mots_en:[['🐱','Choose the right word',['dog','cat','bird'],'cat'],['🐶','Choose the right word',['dog','fish','house'],'dog'],['🍎','Choose the right word',['apple','car','book'],'apple']],
couleurs_en:[['🔴','What color is this?',['blue','green','red'],'red'],['🔵','What color is this?',['red','blue','yellow'],'blue'],['🟢','What color is this?',['green','black','orange'],'green']],
comprehension_en:[['🐱','Which animal says meow?',['cat','dog','cow'],'cat'],['☀️','What do we see in the sky during the day?',['sun','moon','star'],'sun'],['🍎','What can you eat?',['apple','chair','car'],'apple']],
logique:[['🧩','1, 2, 3, 4, ?',5],['🧩','2, 4, 6, 8, ?',10],['🧩','5, 10, 15, 20, ?',25],['🧩','10, 20, 30, 40, ?',50]]};
const NAMES={addition:'Addition',soustraction:'Soustraction',suites:'Suites',comparaison:'Comparaison',mots_ar:'Mots arabes',lettres_ar:'Lettres arabes',vocab_ar:'Vocabulaire arabe',mots_fr:'Mots français',lecture_fr:'Lecture française',vocab_fr:'Vocabulaire français',mots_en:'Mots anglais',couleurs_en:'Couleurs anglaises',comprehension_en:'Compréhension anglaise',logique:'Logique'};
const CATS={evaluation:['📋','Évaluation',Object.keys(NAMES)],calcul:['🔢','Calcul',['addition','soustraction','suites','comparaison']],arabe:['📖','العربية',['mots_ar','lettres_ar','vocab_ar']],francais:['📚','Français',['mots_fr','lecture_fr','vocab_fr']],anglais:['🔤','English',['mots_en','couleurs_en','comprehension_en']],logique:['🧩','Logique',['logique']]};
const $=x=>document.getElementById(x);let quiz=[],pos=0,current=null;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function choices(correct,bank){let vals=bank||[];if(!Array.isArray(vals)){vals=[correct-1,correct+1,correct+2].map(String)}return shuffle(vals.map(String))}
function make(k){const b=BANK[k][Math.floor(Math.random()*BANK[k].length)];let emoji=b[0],text=b[1],answer=b[3]??String(b[2]),ch=Array.isArray(b[2])?b[2]:choices(answer);return {skill:k,emoji,text,answer:String(answer),choices:shuffle(ch.map(String))}}
function start(keys){quiz=shuffle([...keys]).flatMap(k=>[make(k),make(k)]);pos=0;$('home').classList.add('hidden');$('quiz').classList.remove('hidden');show()}
function show(){current=quiz[pos];$('progress').textContent=`Question ${pos+1}/${quiz.length}`;$('skill').textContent=NAMES[current.skill];$('feedback').textContent='';$('next').classList.add('hidden');$('question').innerHTML=`<div class="emoji">${current.emoji}</div><h2 class="center">${current.text}</h2><div class="choices">${shuffle(current.choices).map(x=>`<button class="choice" data-answer="${esc(x)}">${x}</button>`).join('')}</div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.answer))}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function answer(v){const ok=String(v)===String(current.answer);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(String(b.dataset.answer)===String(current.answer))b.classList.add('correct');if(String(b.dataset.answer)===String(v)&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Bravo !':'💪 Pas grave. La bonne réponse est '+current.answer+'.';$('next').classList.remove('hidden')}
$('next').onclick=()=>{pos++;if(pos<quiz.length)show();else{$('feedback').textContent='🎉 Activité terminée !';$('next').classList.add('hidden')}};$('quit').onclick=()=>{$('quiz').classList.add('hidden');$('home').classList.remove('hidden')};
Object.entries(CATS).forEach(([id,c])=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span style="font-size:2rem">${c[0]}</span><b>${c[1]}</b><small>${c[2].length} compétences</small>`;b.onclick=()=>start(c[2]);$('cats').appendChild(b)});
function audit(){let total=0,bad=0,details=[];for(const [skill,arr] of Object.entries(BANK)){for(const b of arr){total++;const ans=String(b[3]??b[2]);const expected=Array.isArray(b[2])?String(b[3]):String(b[2]);if(ans!==expected){bad++;details.push(skill+': '+b[1])}}}const generated=[];for(const skill of Object.keys(BANK)){for(let i=0;i<100;i++){const q=make(skill);if(!q.choices.map(String).includes(String(q.answer))){bad++;details.push(skill+': réponse absente des choix')}}}$('auditResult').innerHTML=`<p><b>Audit terminé :</b> ${total} questions de base + 1400 générations testées.</p><p>${bad===0?'✅ Aucune incohérence détectée.':'❌ '+bad+' problème(s) détecté(s).'}</p>${details.length?'<pre>'+details.join('\n')+'</pre>':''}`}
$('audit').onclick=audit;
</script></body></html>
