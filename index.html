<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les aventures d’Aylan 🚀</title>
<style>
:root{--blue:#238bc1;--sky:#62c7e8;--sun:#ffd15c;--green:#62c978;--red:#f06b62;--ink:#203b4c;--paper:#f4fafd;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--sky) 0 235px,var(--paper) 235px);min-height:100vh}header{text-align:center;color:#fff;padding:34px 16px 62px}h1{font-size:clamp(2rem,7vw,3.2rem);margin:0 0 8px}header p{margin:0;font-weight:bold}main{max-width:950px;margin:-32px auto 45px;padding:0 15px}.panel{background:#fff;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 7px 20px #203b4c18}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{padding:22px;background:#fff;border:0;border-radius:18px;box-shadow:0 6px 15px #203b4c18;text-align:center;cursor:pointer;color:var(--ink);font:inherit}.card:hover{transform:translateY(-2px)}.card span{display:block;font-size:2.5rem}.card b{display:block;font-size:1.2rem;margin:8px 0 4px}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.skill{background:var(--paper);padding:12px;border-radius:14px}.bar{height:9px;background:#dceaf2;border-radius:9px;margin-top:7px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .3s}.mission{border:2px solid var(--sun);background:#fff9e6}button{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer;font-size:1rem}.secondary{background:#e7edf1;color:var(--ink)}.danger{background:var(--red)}button:disabled{opacity:.65;cursor:not-allowed}#quizSection{display:none}.question{text-align:center}.qemoji{font-size:3.3rem;margin:12px}.choices{display:grid;gap:12px;max-width:520px;margin:20px auto}.choice{background:var(--paper);color:var(--ink);border:3px solid #dceaf2}.correct{background:#e4f8e8!important;border-color:var(--green)!important}.wrong{background:#fdeaea!important;border-color:var(--red)!important}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.feedback{min-height:28px;font-weight:bold}.modal{position:fixed;inset:0;background:#203b4ccc;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:20px;padding:24px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.modalbox h2{margin-top:0}input{width:100%;padding:12px;border:2px solid #dceaf2;border-radius:10px;margin:8px 0 12px;font-size:1rem}.hidden{display:none!important}.result{padding:9px;border-bottom:1px solid #e7edf1}.small{color:#587383;font-size:.92rem}.notice{padding:12px;border-radius:12px;background:var(--paper);margin:12px 0}.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:var(--paper);padding:14px;border-radius:14px;text-align:center}.stat strong{font-size:1.5rem;display:block}.error{color:#c33;font-weight:bold}.success{color:#16833c;font-weight:bold}pre{white-space:pre-wrap;background:var(--paper);padding:12px;border-radius:10px;overflow:auto}footer{text-align:center;padding:20px;color:#6e8698}
</style>
</head>
<body>
<header><h1>Les aventures d’Aylan 🚀</h1><p>Chaque exercice te rend plus fort !</p></header>
<main>
<section class="panel top"><div><strong>⭐ <span id="starsValue">0</span> étoiles</strong> · <span id="doneValue">0</span> réponse(s)</div><button id="openParentButton" type="button">🔐 Espace parent</button></section>
<section class="panel"><h2>📊 Mon niveau</h2><div id="skillsDashboard" class="skills"></div></section>
<section class="panel mission"><h2>🎯 Mission du jour</h2><p id="missionText" class="small"></p><button id="startMissionButton" type="button">Commencer 🚀</button></section>
<section id="homeSection" class="grid" aria-label="Choisir un exercice">
<button class="card" type="button" data-category="evaluation"><span>📋</span><b>Évaluation</b><small>15 questions</small></button>
<button class="card" type="button" data-category="calcul"><span>🔢</span><b>Calcul</b><small>Nombres et opérations</small></button>
<button class="card" type="button" data-category="arabe"><span>📖</span><b>العربية</b><small>حروف وكلمات</small></button>
<button class="card" type="button" data-category="francais"><span>📚</span><b>Français</b><small>Mots et lecture</small></button>
<button class="card" type="button" data-category="anglais"><span>🔤</span><b>English</b><small>Words and colors</small></button>
<button class="card" type="button" data-category="logique"><span>🧩</span><b>Logique</b><small>Réfléchir et trouver</small></button>
</section>
<section id="quizSection" class="panel"><div class="top"><span id="progressText"></span><button id="quitButton" class="secondary" type="button">⬅ Retour</button></div><h2 id="quizTitle"></h2><div id="questionArea"></div><div class="actions"><button id="nextButton" class="hidden" type="button">Suivant ➜</button></div></section>
</main><footer>Fait avec ❤️ pour Aylan</footer>
<div id="parentModal" class="modal" aria-hidden="true"><div class="modalbox">
<div id="loginPanel"><h2>🔐 Espace parent</h2><p class="small">Les résultats détaillés sont protégés.</p><input id="parentPasswordInput" type="password" autocomplete="current-password" placeholder="Mot de passe parent"><div class="actions"><button id="loginButton" type="button">Se connecter</button><button id="closeParentButton" class="secondary" type="button">Fermer</button></div><p id="loginMessage" class="small"></p></div>
<div id="parentPanel" class="hidden"><div class="top"><h2>📈 Suivi d’Aylan</h2><button id="logoutButton" class="danger" type="button">Déconnexion</button></div><div id="parentSummary"></div><h3>🧠 Progression par compétence</h3><div id="parentSkills" class="skills"></div><h3>📝 Dernières réponses</h3><div id="historyList"></div><div class="actions"><button id="exportButton" type="button">📦 Exporter JSON</button><button id="qwenButton" type="button">🤖 Préparer Qwen</button></div><pre id="qwenOutput"></pre></div>
</div></div>
<script>
'use strict';
const SKILLS={addition:'Addition',soustraction:'Soustraction',suites:'Suites',comparaison:'Comparaison',mots_ar:'Mots arabes',lettres_ar:'Lettres arabes',vocab_ar:'Vocabulaire arabe',mots_fr:'Mots français',lecture_fr:'Lecture française',vocab_fr:'Vocabulaire français',mots_en:'Mots anglais',couleurs_en:'Couleurs anglaises',comprehension_en:'Compréhension anglaise',logique:'Logique'};
const QUESTIONS={
evaluation:[['🔢','5 + 3 = ?',['7','8','9'],1,'addition'],['🔢','12 - 4 = ?',['7','8','9'],1,'soustraction'],['🔢','Après 19 ?',['18','20','21'],1,'suites'],['🔢','Le plus grand ?',['35','53','28'],1,'comparaison'],['🐱','اختر الكلمة الصحيحة',['قطة','كلب','بيت'],0,'mots_ar'],['☀️','اختر الكلمة الصحيحة',['قمر','شمس','نجمة'],1,'vocab_ar'],['🏠','اختر الكلمة الصحيحة',['شجرة','باب','بيت'],2,'mots_ar'],['✏️','الحرف الأول في «قلم» ؟',['ق','ل','م'],0,'lettres_ar'],['🐱','Choisis le bon mot',['chat','chien','oiseau'],0,'mots_fr'],['☀️','Choisis le bon mot',['lune','soleil','étoile'],1,'vocab_fr'],['🔤','Première lettre de « livre » ?',['l','v','b'],0,'lecture_fr'],['🐱','Choose the right word',['dog','cat','bird'],1,'mots_en'],['🔴','What color is this?',['blue','green','red'],2,'couleurs_en'],['🍎🍎🍎','Count the apples',['two','three','four'],1,'comprehension_en'],['🔴🔵🔴🔵🔴','Que vient après ?',['🔴','🔵','🟢'],1,'logique']],
calcul:[['➕','3 + 4 = ?',['7','6','8'],0,'addition'],['➖','9 - 5 = ?',['5','3','4'],2,'soustraction'],['➕','8 + 6 = ?',['13','14','15'],1,'addition'],['🔢','Après 17 ?',['19','18','16'],1,'suites'],['➖','12 - 7 = ?',['4','6','5'],2,'soustraction'],['🔎','Le plus grand ?',['42','24','19'],0,'comparaison']],
arabe:[['🐱','اختر الكلمة الصحيحة',['قطة','كلب','بيت'],0,'mots_ar'],['☀️','اختر الكلمة الصحيحة',['قمر','شمس','نجمة'],1,'vocab_ar'],['✏️','الحرف الأول في «قلم» ؟',['ق','ل','م'],0,'lettres_ar']],
francais:[['🐱','Choisis le bon mot',['chat','chien','oiseau'],0,'mots_fr'],['☀️','Choisis le bon mot',['lune','soleil','étoile'],1,'vocab_fr'],['🔤','Première lettre de « livre » ?',['l','v','b'],0,'lecture_fr']],
anglais:[['🐱','Choose the right word',['dog','cat','bird'],1,'mots_en'],['🔴','What color is this?',['blue','green','red'],2,'couleurs_en'],['🍎','What is this?',['apple','house','car'],0,'comprehension_en']],
logique:[['🔴🔵🔴🔵🔴','Que vient après ?',['🔴','🔵','🟢'],1,'logique'],['1️⃣2️⃣3️⃣','Que vient après ?',['2','4','5'],1,'logique']]
};
const els={stars:document.getElementById('starsValue'),done:document.getElementById('doneValue'),dashboard:document.getElementById('skillsDashboard'),missionText:document.getElementById('missionText'),missionButton:document.getElementById('startMissionButton'),home:document.getElementById('homeSection'),quiz:document.getElementById('quizSection'),title:document.getElementById('quizTitle'),progress:document.getElementById('progressText'),question:document.getElementById('questionArea'),next:document.getElementById('nextButton'),quit:document.getElementById('quitButton'),modal:document.getElementById('parentModal'),loginPanel:document.getElementById('loginPanel'),parentPanel:document.getElementById('parentPanel'),password:document.getElementById('parentPasswordInput'),login:document.getElementById('loginButton'),close:document.getElementById('closeParentButton'),loginMessage:document.getElementById('loginMessage'),logout:document.getElementById('logoutButton'),summary:document.getElementById('parentSummary'),parentSkills:document.getElementById('parentSkills'),history:document.getElementById('historyList'),export:document.getElementById('exportButton'),qwen:document.getElementById('qwenButton'),qwenOutput:document.getElementById('qwenOutput')};
let profile=loadProfile(), currentQuestions=[], currentIndex=0, currentScore=0, currentCategory='', parentResults=[];
function loadProfile(){try{return JSON.parse(localStorage.getItem('aylanProfile')||'{}')}catch(e){return {}}}
function saveProfile(){localStorage.setItem('aylanProfile',JSON.stringify(profile))}
function skillStats(skill){const s=(profile.skills&&profile.skills[skill])||{a:0,c:0,recent:[]};const pct=s.a?Math.round(s.c/s.a*100):0;const level=pct<40?1:pct<60?2:pct<80?3:4;return {a:s.a,c:s.c,pct,level}}
function renderDashboard(){const html=Object.entries(SKILLS).map(([key,name])=>{const s=skillStats(key);return `<div class="skill"><b>${name}</b><br><span class="small">Niveau ${s.level} · ${s.pct}%</span><div class="bar"><div class="fill" style="width:${s.pct}%"></div></div></div>`}).join('');els.dashboard.innerHTML=html;els.stars.textContent=profile.stars||0;els.done.textContent=profile.done||0;const weak=Object.keys(SKILLS).map(k=>[skillStats(k).pct,k]).sort((a,b)=>a[0]-b[0])[0];els.missionText.textContent=weak[0]===0?'Commence par l’évaluation pour découvrir ton niveau.':`Aujourd’hui, on travaille surtout : ${SKILLS[weak[1])}.`}
function renderDashboard(){const html=Object.entries(SKILLS).map(([key,name])=>{const s=skillStats(key);return `<div class="skill"><b>${name}</b><br><span class="small">Niveau ${s.level} · ${s.pct}%</span><div class="bar"><div class="fill" style="width:${s.pct}%"></div></div></div>`}).join('');els.dashboard.innerHTML=html;els.stars.textContent=profile.stars||0;els.done.textContent=profile.done||0;const weak=Object.keys(SKILLS).map(k=>[skillStats(k).pct,k]).sort((a,b)=>a[0]-b[0])[0];els.missionText.textContent=weak[0]===0?'Commence par l’évaluation pour découvrir ton niveau.':`Aujourd’hui, on travaille surtout : ${SKILLS[weak[1]]}.`}
function startQuiz(category){currentCategory=category;currentQuestions=(QUESTIONS[category]||QUESTIONS.evaluation).map(q=>({emoji:q[0],text:q[1],choices:q[2],correctIndex:q[3],skill:q[4]}));currentIndex=0;currentScore=0;els.home.classList.add('hidden');els.quiz.style.display='block';els.title.textContent=category==='evaluation'?'Évaluation':category.charAt(0).toUpperCase()+category.slice(1);renderQuestion()}
function renderQuestion(){const q=currentQuestions[currentIndex];els.progress.textContent=`Question ${currentIndex+1} / ${currentQuestions.length}`;els.question.innerHTML=`<div class="question"><div class="qemoji">${q.emoji}</div><h2>${q.text}</h2><div class="choices">${q.choices.map((choice,index)=>`<button class="choice" type="button" data-index="${index}">${choice}</button>`).join('')}</div><p id="questionFeedback" class="feedback"></p></div>`;els.next.classList.add('hidden');els.question.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>answerQuestion(Number(button.dataset.index)),{once:true}))}
async function answerQuestion(selected){const q=currentQuestions[currentIndex];const correct=selected===q.correctIndex;if(correct)currentScore++;if(!profile.skills)profile.skills={};if(!profile.skills[q.skill])profile.skills[q.skill]={a:0,c:0,recent:[]};const s=profile.skills[q.skill];s.a++;if(correct)s.c++;s.recent=(s.recent||[]).concat(correct).slice(-10);profile.done=(profile.done||0)+1;profile.stars=(profile.stars||0)+(correct?2:0);saveProfile();els.question.querySelectorAll('.choice').forEach((button,index)=>{button.disabled=true;if(index===q.correctIndex)button.classList.add('correct');if(index===selected&&!correct)button.classList.add('wrong')});const feedback=document.getElementById('questionFeedback');feedback.textContent=correct?'🎉 Bravo !':'💪 Ce n’est pas grave, on continue !';feedback.className=`feedback ${correct?'success':''}`;els.next.classList.remove('hidden');renderDashboard();try{await fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:q.skill,subject:currentCategory,question:q.text,answer:q.choices[selected]||'',correctAnswer:q.choices[q.correctIndex],correct,difficulty:skillStats(q.skill).level})})}catch(e){} }
function finishQuiz(){els.quiz.innerHTML=`<div style="text-align:center"><h2>🎉 Bravo !</h2><p>Résultat : <b>${currentScore}/${currentQuestions.length}</b></p><button id="returnHomeButton" type="button">Retour aux exercices</button></div>`;document.getElementById('returnHomeButton').addEventListener('click',()=>location.reload())}
function openParent(){els.modal.classList.add('open');els.modal.setAttribute('aria-hidden','false');els.loginPanel.classList.remove('hidden');els.parentPanel.classList.add('hidden');els.loginMessage.textContent='';els.password.value='';setTimeout(()=>els.password.focus(),50)}
function closeParent(){els.modal.classList.remove('open');els.modal.setAttribute('aria-hidden','true')}
async function loginParent(){els.loginMessage.textContent='Connexion…';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:els.password.value})});if(!response.ok){els.loginMessage.textContent='Mot de passe incorrect ou serveur indisponible.';return}els.loginPanel.classList.add('hidden');els.parentPanel.classList.remove('hidden');await loadParentResults()}catch(e){els.loginMessage.textContent='Impossible de contacter le serveur.'}}
async function loadParentResults(){const response=await fetch('/api/results');if(!response.ok){els.summary.innerHTML='<p class="error">Impossible de charger les résultats.</p>';return}const data=await response.json();parentResults=Array.isArray(data.results)?data.results:[];renderParent()}
function renderParent(){const total=parentResults.length,correct=parentResults.filter(r=>r.correct).length,pct=total?Math.round(correct/total*100):0;els.summary.innerHTML=`<div class="statgrid"><div class="stat"><strong>${total}</strong>Réponses</div><div class="stat"><strong>${correct}</strong>Réussites</div><div class="stat"><strong>${pct}%</strong>Réussite</div></div>`;els.parentSkills.innerHTML=Object.entries(SKILLS).map(([key,name])=>{const rows=parentResults.filter(r=>r.skill===key),c=rows.filter(r=>r.correct).length,p=rows.length?Math.round(c/rows.length*100):0;return `<div class="skill"><b>${name}</b><br><span class="small">${rows.length} tentative(s) · ${p}%</span><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}).join('');els.history.innerHTML=parentResults.slice(0,40).map(r=>`<div class="result">${new Date(r.createdAt).toLocaleString('fr-CA')} · <b>${SKILLS[r.skill]||r.skill}</b> · ${r.correct?'✅':'❌'} ${escapeHtml(r.answer)}</div>`).join('')||'<p class="small">Aucun résultat enregistré.</p>';els.qwenOutput.textContent=''}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exportResults(){const blob=new Blob([JSON.stringify(parentResults,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aylan-resultats.json';a.click();URL.revokeObjectURL(url)}
function prepareQwen(){els.qwenOutput.textContent=`Tu es un assistant pédagogique pour un enfant de 7 ans. Analyse cet historique d’exercices. Identifie les compétences solides, les compétences à renforcer et propose une mission de 7 jours. Le moteur du site reste décisionnaire des niveaux : tu proposes, tu ne modifies jamais les niveaux directement.\n\nHISTORIQUE :\n${JSON.stringify(parentResults,null,2)}`}
document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>startQuiz(button.dataset.category)));els.missionButton.addEventListener('click',()=>startQuiz('evaluation'));els.quit.addEventListener('click',()=>location.reload());els.next.addEventListener('click',()=>{currentIndex++;if(currentIndex<currentQuestions.length)renderQuestion();else finishQuiz()});document.getElementById('openParentButton').addEventListener('click',openParent);els.close.addEventListener('click',closeParent);els.login.addEventListener('click',loginParent);els.password.addEventListener('keydown',event=>{if(event.key==='Enter')loginParent()});els.logout.addEventListener('click',async()=>{try{await fetch('/api/login',{method:'DELETE'})}finally{closeParent();location.reload()}});els.export.addEventListener('click',exportResults);els.qwen.addEventListener('click',prepareQwen);els.modal.addEventListener('click',event=>{if(event.target===els.modal)closeParent()});renderDashboard();
</script>
</body></html>
