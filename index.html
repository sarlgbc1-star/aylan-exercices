<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les aventures d’Aylan 🚀</title><style>:root{--b:#238bc1;--sky:#62c7e8;--sun:#ffd15c;--g:#62c978;--r:#f06b62;--ink:#203b4c;--p:#f4fafd}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--sky) 0 220px,var(--p) 220px);min-height:100vh}header{text-align:center;color:#fff;padding:32px 15px 58px}h1{font-size:clamp(2rem,7vw,3.2rem);margin:0 0 8px}main{max-width:950px;margin:-28px auto 40px;padding:0 15px}.panel{background:#fff;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 6px 18px #203b4c18}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid,.skills,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{padding:22px;border:0;border-radius:18px;background:#fff;box-shadow:0 5px 15px #203b4c18;cursor:pointer;color:var(--ink);font:inherit}.card span{display:block;font-size:2.5rem}.card b{display:block;font-size:1.15rem;margin:8px}.skill,.stat{background:var(--p);padding:12px;border-radius:14px}.bar{height:8px;background:#dceaf2;border-radius:8px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--g)}button{border:0;border-radius:12px;padding:11px 16px;background:var(--b);color:#fff;font-weight:bold;cursor:pointer;font-size:1rem}.secondary{background:#e7edf1;color:var(--ink)}.danger{background:var(--r)}button:disabled{opacity:.65;cursor:not-allowed}.hidden{display:none!important}.question{text-align:center}.emoji{font-size:3.2rem}.choices{display:grid;gap:12px;max-width:520px;margin:20px auto}.choice{background:var(--p);color:var(--ink);border:3px solid #dceaf2}.correct{background:#e4f8e8!important;border-color:var(--g)!important}.wrong{background:#fdeaea!important;border-color:var(--r)!important}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#203b4ccc;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow:auto}input{width:100%;padding:12px;border:2px solid #dceaf2;border-radius:10px;margin:8px 0 12px;font-size:1rem}.small{color:#587383;font-size:.9rem}.result{padding:8px;border-bottom:1px solid #e7edf1}pre{white-space:pre-wrap;background:var(--p);padding:12px;border-radius:10px}footer{text-align:center;padding:20px;color:#6e8698}</style></head><body><header><h1>Les aventures d’Aylan 🚀</h1><p>Chaque exercice te rend plus fort !</p></header><main><section class="panel top"><strong>⭐ <span id="stars">0</span> étoiles</strong><span><span id="done">0</span> réponse(s)</span><button id="parentOpen" type="button">🔐 Espace parent</button></section><section class="panel"><h2>📊 Mon niveau</h2><div id="dashboard" class="skills"></div></section><section class="panel"><h2>🎯 Mission du jour</h2><p id="mission" class="small"></p><button id="missionStart" type="button">Commencer 🚀</button></section><section id="home" class="grid"><button class="card" data-cat="evaluation" type="button"><span>📋</span><b>Évaluation</b><small>15 questions</small></button><button class="card" data-cat="calcul" type="button"><span>🔢</span><b>Calcul</b><small>Nombres et opérations</small></button><button class="card" data-cat="arabe" type="button"><span>📖</span><b>العربية</b><small>حروف وكلمات</small></button><button class="card" data-cat="francais" type="button"><span>📚</span><b>Français</b><small>Mots et lecture</small></button><button class="card" data-cat="anglais" type="button"><span>🔤</span><b>English</b><small>Words and colors</small></button><button class="card" data-cat="logique" type="button"><span>🧩</span><b>Logique</b><small>Réfléchir</small></button></section><section id="quiz" class="panel hidden"><div class="top"><span id="progress"></span><button id="quit" class="secondary" type="button">⬅ Retour</button></div><h2 id="quizTitle"></h2><div id="question"></div><div class="actions"><button id="next" class="hidden" type="button">Suivant ➜</button></div></section></main><footer>Fait avec ❤️ pour Aylan</footer><div id="modal" class="modal"><div class="box"><div id="loginPanel"><h2>🔐 Espace parent</h2><p class="small">Les résultats détaillés sont protégés.</p><input id="password" type="password" placeholder="Mot de passe parent"><div class="actions"><button id="login" type="button">Se connecter</button><button id="close" class="secondary" type="button">Fermer</button></div><p id="loginMsg" class="small"></p></div><div id="parentPanel" class="hidden"><div class="top"><h2>📈 Suivi d’Aylan</h2><button id="logout" class="danger" type="button">Déconnexion</button></div><div id="summary"></div><h3>Compétences</h3><div id="parentSkills" class="skills"></div><h3>Historique</h3><div id="history"></div><div class="actions"><button id="export" type="button">📦 Exporter JSON</button><button id="qwen" type="button">🤖 Préparer Qwen</button></div><pre id="qwenOut"></pre></div></div></div><script>
'use strict';
const SK={addition:'Addition',soustraction:'Soustraction',suites:'Suites',comparaison:'Comparaison',mots_ar:'Mots arabes',lettres_ar:'Lettres arabes',vocab_ar:'Vocabulaire arabe',mots_fr:'Mots français',lecture_fr:'Lecture française',vocab_fr:'Vocabulaire français',mots_en:'Mots anglais',couleurs_en:'Couleurs anglaises',comprehension_en:'Compréhension anglaise',logique:'Logique'};
const Q={evaluation:[['🔢','5 + 3 = ?',['7','8','9'],1,'addition'],['🔢','12 - 4 = ?',['7','8','9'],1,'soustraction'],['🔢','Après 19 ?',['18','20','21'],1,'suites'],['🔎','Le plus grand ?',['35','53','28'],1,'comparaison'],['🐱','اختر الكلمة الصحيحة',['قطة','كلب','بيت'],0,'mots_ar'],['☀️','اختر الكلمة الصحيحة',['قمر','شمس','نجمة'],1,'vocab_ar'],['🏠','اختر الكلمة الصحيحة',['شجرة','باب','بيت'],2,'mots_ar'],['✏️','الحرف الأول في «قلم» ؟',['ق','ل','م'],0,'lettres_ar'],['🐱','Choisis le bon mot',['chat','chien','oiseau'],0,'mots_fr'],['☀️','Choisis le bon mot',['lune','soleil','étoile'],1,'vocab_fr'],['🔤','Première lettre de « livre » ?',['l','v','b'],0,'lecture_fr'],['🐱','Choose the right word',['dog','cat','bird'],1,'mots_en'],['🔴','What color is this?',['blue','green','red'],2,'couleurs_en'],['🍎🍎🍎','Count the apples',['two','three','four'],1,'comprehension_en'],['🔴🔵🔴🔵🔴','Que vient après ?',['🔴','🔵','🟢'],1,'logique']],calcul:[['➕','3 + 4 = ?',['7','6','8'],0,'addition'],['➖','9 - 5 = ?',['5','3','4'],2,'soustraction'],['➕','8 + 6 = ?',['13','14','15'],1,'addition'],['🔢','Après 17 ?',['19','18','16'],1,'suites'],['➖','12 - 7 = ?',['4','6','5'],2,'soustraction'],['🔎','Le plus grand ?',['42','24','19'],0,'comparaison']],arabe:[['🐱','اختر الكلمة الصحيحة',['قطة','كلب','بيت'],0,'mots_ar'],['☀️','اختر الكلمة الصحيحة',['قمر','شمس','نجمة'],1,'vocab_ar'],['✏️','الحرف الأول في «قلم» ؟',['ق','ل','م'],0,'lettres_ar']],francais:[['🐱','Choisis le bon mot',['chat','chien','oiseau'],0,'mots_fr'],['☀️','Choisis le bon mot',['lune','soleil','étoile'],1,'vocab_fr'],['🔤','Première lettre de « livre » ?',['l','v','b'],0,'lecture_fr']],anglais:[['🐱','Choose the right word',['dog','cat','bird'],1,'mots_en'],['🔴','What color is this?',['blue','green','red'],2,'couleurs_en'],['🍎','What is this?',['apple','house','car'],0,'comprehension_en']],logique:[['🔴🔵🔴🔵🔴','Que vient après ?',['🔴','🔵','🟢'],1,'logique'],['1️⃣2️⃣3️⃣','Que vient après ?',['2','4','5'],1,'logique']]};
const $=id=>document.getElementById(id);const el={stars:$('stars'),done:$('done'),dash:$('dashboard'),mission:$('mission'),home:$('home'),quiz:$('quiz'),title:$('quizTitle'),progress:$('progress'),question:$('question'),next:$('next'),modal:$('modal'),loginPanel:$('loginPanel'),parentPanel:$('parentPanel'),password:$('password'),loginMsg:$('loginMsg'),summary:$('summary'),skills:$('parentSkills'),history:$('history'),qwenOut:$('qwenOut')};let profile={};try{profile=JSON.parse(localStorage.getItem('aylanProfile')||'{}')}catch{}let list=[],index=0,score=0,cat='',results=[];
function save(){localStorage.setItem('aylanProfile',JSON.stringify(profile))}function stat(k){const s=profile.skills?.[k]||{a:0,c:0,recent:[]};const p=s.a?Math.round(s.c/s.a*100):0;return{a:s.a,c:s.c,p,level:p<40?1:p<60?2:p<80?3:4}}function dashboard(){el.dash.innerHTML=Object.entries(SK).map(([k,n])=>{const s=stat(k);return `<div class="skill"><b>${n}</b><br><span class="small">Niveau ${s.level} · ${s.p}%</span><div class="bar"><div class="fill" style="width:${s.p}%"></div></div></div>`}).join('');el.stars.textContent=profile.stars||0;el.done.textContent=profile.done||0;const weak=Object.keys(SK).sort((a,b)=>stat(a).p-stat(b).p)[0];el.mission.textContent=stat(weak).a?`Aujourd’hui : ${SK[weak]}.`:'Commence par l’évaluation pour découvrir ton niveau.'}
function start(c){cat=c;list=(Q[c]||Q.evaluation).map(x=>({emoji:x[0],text:x[1],choices:x[2],correct:x[3],skill:x[4]}));index=0;score=0;el.home.classList.add('hidden');el.quiz.classList.remove('hidden');el.title.textContent=c==='evaluation'?'Évaluation':c[0].toUpperCase()+c.slice(1);show()}
function show(){const q=list[index];el.progress.textContent=`Question ${index+1} / ${list.length}`;el.question.innerHTML=`<div class="question"><div class="emoji">${q.emoji}</div><h2>${q.text}</h2><div class="choices">${q.choices.map((x,i)=>`<button class="choice" data-i="${i}" type="button">${x}</button>`).join('')}</div><p id="feedback"></p></div>`;el.next.classList.add('hidden');el.question.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i)),{once:true}))}
async function answer(selected){const q=list[index],ok=selected===q.correct;if(ok)score++;profile.skills??={};profile.skills[q.skill]??={a:0,c:0,recent:[]};const s=profile.skills[q.skill];s.a++;if(ok)s.c++;s.recent=(s.recent||[]).concat(ok).slice(-10);profile.done=(profile.done||0)+1;profile.stars=(profile.stars||0)+(ok?2:0);save();el.question.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');if(i===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Bravo !':'💪 Ce n’est pas grave, on continue !';el.next.classList.remove('hidden');dashboard();try{await fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:q.skill,subject:cat,question:q.text,answer:q.choices[selected]||'',correctAnswer:q.choices[q.correct],correct,difficulty:stat(q.skill).level})})}catch(e){} }
function finish(){el.quiz.innerHTML=`<div style="text-align:center"><h2>🎉 Bravo !</h2><p>Résultat : <b>${score}/${list.length}</b></p><button id="backHome" type="button">Retour aux exercices</button></div>`;$('backHome').addEventListener('click',()=>location.reload())}
function openParent(){el.modal.classList.add('open');el.loginPanel.classList.remove('hidden');el.parentPanel.classList.add('hidden');el.loginMsg.textContent='';el.password.value='';setTimeout(()=>el.password.focus(),50)}function closeParent(){el.modal.classList.remove('open')}
async function login(){el.loginMsg.textContent='Connexion…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:el.password.value})});if(!r.ok){el.loginMsg.textContent=r.status===503?'Le mot de passe parent n’est pas encore configuré.':'Mot de passe incorrect.';return}el.loginPanel.classList.add('hidden');el.parentPanel.classList.remove('hidden');await loadResults()}catch{el.loginMsg.textContent='Serveur inaccessible.'}}
async function loadResults(){const r=await fetch('/api/results');if(!r.ok){el.summary.innerHTML='<p>Impossible de charger les résultats.</p>';return}const d=await r.json();results=Array.isArray(d.results)?d.results:[];renderParent()}
function renderParent(){const total=results.length,good=results.filter(x=>x.correct).length,p=total?Math.round(good/total*100):0;el.summary.innerHTML=`<div class="stats"><div class="stat"><strong>${total}</strong>Réponses</div><div class="stat"><strong>${good}</strong>Réussites</div><div class="stat"><strong>${p}%</strong>Réussite</div></div>`;el.skills.innerHTML=Object.entries(SK).map(([k,n])=>{const r=results.filter(x=>x.skill===k),g=r.filter(x=>x.correct).length,p=r.length?Math.round(g/r.length*100):0;return `<div class="skill"><b>${n}</b><br><span class="small">${r.length} tentative(s) · ${p}%</span><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}).join('');el.history.innerHTML=results.slice(0,40).map(x=>`<div class="result">${new Date(x.createdAt).toLocaleString('fr-CA')} · <b>${SK[x.skill]||x.skill}</b> · ${x.correct?'✅':'❌'} ${safe(x.answer)}</div>`).join('')||'<p class="small">Aucun résultat.</p>';el.qwenOut.textContent=''}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));a.download='aylan-resultats.json';a.click()}function qwen(){el.qwenOut.textContent=`Tu es un assistant pédagogique pour un enfant de 7 ans. Analyse cet historique, identifie les forces et les compétences à renforcer et propose une mission de 7 jours. Le moteur du site reste décisionnaire des niveaux.\n\nHISTORIQUE :\n${JSON.stringify(results,null,2)}`}
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.cat)));$('missionStart').addEventListener('click',()=>start('evaluation'));$('quit').addEventListener('click',()=>location.reload());el.next.addEventListener('click',()=>{index++;index<list.length?show():finish()});$('parentOpen').addEventListener('click',openParent);$('close').addEventListener('click',closeParent);$('login').addEventListener('click',login);el.password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').addEventListener('click',async()=>{try{await fetch('/api/login',{method:'DELETE'})}finally{closeParent();location.reload()}});$('export').addEventListener('click',exportData);$('qwen').addEventListener('click',qwen);el.modal.addEventListener('click',e=>{if(e.target===el.modal)closeParent()});dashboard();
</script></body></html>
