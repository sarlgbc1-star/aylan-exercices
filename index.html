<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les aventures d’Aylan 🚀</title><style>
:root{--blue:#2fa9d6;--sky:#5ec4e8;--sun:#ffc64b;--green:#6fcf7a;--red:#ff6f5e;--ink:#203b4c;--paper:#f4fafd}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--sky) 0 260px,var(--paper) 260px)}header{text-align:center;color:white;padding:38px 15px 65px}h1{margin:0;font-size:clamp(2rem,7vw,3.2rem)}header p{font-weight:bold}main{max-width:900px;margin:-35px auto 50px;padding:0 15px}.panel{background:#fff;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 7px 20px #203b4c18}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.skill{background:var(--paper);padding:12px;border-radius:14px}.bar{height:8px;background:#dceaf2;border-radius:8px;margin-top:7px;overflow:hidden}.fill{height:100%;background:var(--green)}.mission{border:2px solid var(--sun);background:#fff9e6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{padding:22px;background:#fff;border:0;border-radius:18px;box-shadow:0 6px 15px #203b4c18;text-align:center;cursor:pointer}.card b{display:block;font-size:1.2rem;margin-top:8px}.card span{font-size:2.3rem}button{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#e7edf1;color:var(--ink)}.danger{background:var(--red)}#quiz{display:none}.question{text-align:center}.qemoji{font-size:3rem}.choices{display:grid;gap:12px;max-width:500px;margin:20px auto}.choice{background:var(--paper);color:var(--ink);border:3px solid #dceaf2;font-size:1.1rem}.correct{background:#e4f8e8!important;border-color:var(--green)!important}.wrong{background:#fdeaea!important;border-color:var(--red)!important}.actions{display:flex;justify-content:center;gap:10px}.modal{position:fixed;inset:0;background:#203b4ccc;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modalbox{background:white;border-radius:20px;padding:24px;max-width:700px;width:100%;max-height:90vh;overflow:auto}input{width:100%;padding:12px;border:2px solid #dceaf2;border-radius:10px;margin:8px 0 12px;font-size:1rem}.hidden{display:none}.result{padding:9px;border-bottom:1px solid #e7edf1}.small{color:#587383;font-size:.9rem}footer{text-align:center;padding:20px;color:#6e8698}
</style></head><body><header><h1>Les aventures d’Aylan 🚀</h1><p>Chaque exercice te rend plus fort !</p></header><main>
<section class="panel top"><strong>⭐ <span id="stars">0</span> étoiles</strong><span id="done">0 exercice complété</span><button id="parentBtn">🔐 Espace parent</button></section>
<section class="panel"><h2>📊 Mon niveau</h2><div id="dashboard" class="skills"></div></section>
<section class="panel mission"><h2>🎯 Mission du jour</h2><p id="missionText" class="small"></p><button id="missionBtn">Commencer 🚀</button></section>
<section id="home" class="grid"><button class="card" data-cat="evaluation"><span>📋</span><b>Évaluation</b><small>15 questions</small></button><button class="card" data-cat="calcul"><span>🔢</span><b>Calcul</b><small>Nombres et opérations</small></button><button class="card" data-cat="arabe"><span>📖</span><b>العربية</b><small>حروف وكلمات</small></button><button class="card" data-cat="francais"><span>📚</span><b>Français</b><small>Mots et lecture</small></button><button class="card" data-cat="anglais"><span>🔤</span><b>English</b><small>Words and colors</small></button><button class="card" data-cat="logique"><span>🧩</span><b>Logique</b><small>Réfléchir et trouver</small></button></section>
<section id="quiz" class="panel"><div class="top"><span id="progress"></span><button class="secondary" id="quit">⬅ Retour</button></div><h2 id="quizTitle"></h2><div id="question"></div><div class="actions"><button id="next" class="hidden">Suivant ➜</button></div></section></main><footer>Fait avec ❤️ pour Aylan</footer>
<div id="modal" class="modal"><div class="modalbox"><div id="login"><h2>🔐 Espace parent</h2><p class="small">Les résultats détaillés sont protégés.</p><input id="password" type="password" placeholder="Mot de passe parent"><button id="loginBtn">Se connecter</button><button class="secondary" id="closeLogin">Fermer</button><p id="loginError" class="small"></p></div><div id="parent" class="hidden"><div class="top"><h2>📈 Suivi d’Aylan</h2><button class="danger" id="logout">Déconnexion</button></div><div id="parentStats"></div><button id="export">📦 Exporter les résultats JSON</button><button id="prompt">🤖 Préparer le prompt pour Qwen</button><pre id="qwenPrompt" style="white-space:pre-wrap;background:var(--paper);padding:12px;border-radius:10px"></pre></div></div></div>
<script>
const N={addition:'Addition',soustraction:'Soustraction',suites:'Suites',comparaison:'Comparaison',mots_ar:'Mots arabes',lettres_ar:'Lettres arabes',vocab_ar:'Vocabulaire arabe',mots_fr:'Mots français',lecture_fr:'Lecture française',vocab_fr:'Vocabulaire français',mots_en:'Mots anglais',couleurs_en:'Couleurs anglaises',comprehension_en:'Compréhension anglaise',logique:'Logique'};
const Q={evaluation:[['🔢','5 + 3 = ?',['7','8','9'],1,'addition'],['🔢','12 - 4 = ?',['7','8','9'],1,'soustraction'],['🔢','Après 19 ?',['18','20','21'],1,'suites'],['🔢','Le plus grand ?',['35','53','28'],1,'comparaison'],['🐱','اختر الكلمة الصحيحة',['قطة','كلب','بيت'],0,'mots_ar'],['☀️','اختر الكلمة الصحيحة',['قمر','شمس','نجمة'],1,'vocab_ar'],['🏠','اختر الكلمة الصحيحة',['شجرة','باب','بيت'],2,'mots_ar'],['✏️','الحرف الأول في «قلم» ؟',['ق','ل','م'],0,'lettres_ar'],['🐱','Choisis le bon mot',['chat','chien','oiseau'],0,'mots_fr'],['☀️','Choisis le bon mot',['lune','soleil','étoile'],1,'vocab_fr'],['🔤','Première lettre de « livre » ?',['l','v','b'],0,'lecture_fr'],['🐱','Choose the right word',['dog','cat','bird'],1,'mots_en'],['🔴','What color is this?',['blue','green','red'],2,'couleurs_en'],['🍎🍎🍎','Count the apples',['two','three','four'],1,'comprehension_en'],['🔴🔵🔴🔵🔴','Que vient après ?',['🔴','🔵','🟢'],1,'logique']],calcul:[['➕','3 + 4 = ?',['7','6','8'],0,'addition'],['➖','9 - 5 = ?',['5','3','4'],2,'soustraction'],['➕','8 + 6 = ?',['13','14','15'],1,'addition'],['🔢','Après 17 ?',['19','18','16'],1,'suites'],['➖','12 - 7 = ?',['4','6','5'],2,'soustraction'],['🔎','Le plus grand ?',['42','24','19'],0,'comparaison']],arabe:[['🐱','اختر الكلمة الصحيحة',['قطة','كلب','بيت'],0,'mots_ar'],['☀️','اختر الكلمة الصحيحة',['قمر','شمس','نجمة'],1,'vocab_ar'],['✏️','الحرف الأول في «قلم» ؟',['ق','ل','م'],0,'lettres_ar']],francais:[['🐱','Choisis le bon mot',['chat','chien','oiseau'],0,'mots_fr'],['☀️','Choisis le bon mot',['lune','soleil','étoile'],1,'vocab_fr'],['🔤','Première lettre de « livre » ?',['l','v','b'],0,'lecture_fr']],anglais:[['🐱','Choose the right word',['dog','cat','bird'],1,'mots_en'],['🔴','What color is this?',['blue','green','red'],2,'couleurs_en'],['🍎','What is this?',['apple','house','car'],0,'comprehension_en']],logique:[['🔴🔵🔴🔵🔴','Que vient après ?',['🔴','🔵','🟢'],1,'logique'],['1️⃣2️⃣3️⃣','Que vient après ?',['2','4','5'],1,'logique']]};
let profile=JSON.parse(localStorage.getItem('aylanProfile')||'{}'), current=[],i=0,score=0,answers=[]; const save=()=>localStorage.setItem('aylanProfile',JSON.stringify(profile));
function stats(){const s=profile.skills||{};dashboard.innerHTML=Object.entries(N).map(([k,v])=>{let x=s[k]||{a:0,c:0};let p=x.a?Math.round(x.c/x.a*100):0;let level=p<40?1:p<60?2:p<80?3:4;return `<div class="skill"><b>${v}</b><br><span class="small">Niveau ${level} · ${p}%</span><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}).join('');stars.textContent=profile.stars||0;done.textContent=`${profile.done||0} exercice${(profile.done||0)>1?'s':''} complété${(profile.done||0)>1?'s':''}`;let weak=Object.entries(N).map(([k,v])=>{let x=s[k]||{a:0,c:0};return [x.a?x.c/x.a:0,k,v]}).sort((a,b)=>a[0]-b[0])[0];missionText.textContent=weak?`Aujourd’hui, on travaille surtout : ${weak[2]}.`:'Commence par l’évaluation pour découvrir ton niveau.'}
function start(cat){current=(Q[cat]||Q.evaluation).map(x=>({emoji:x[0],q:x[1],choices:x[2],correct:x[3],skill:x[4],difficulty:1,subject:cat}));i=0;score=0;answers=[];home.style.display='none';quiz.style.display='block';quizTitle.textContent=cat==='evaluation'?'Évaluation':cat[0].toUpperCase()+cat.slice(1);show();}
function show(){let q=current[i];progress.textContent=`Question ${i+1} / ${current.length}`;question.innerHTML=`<div class="question"><div class="qemoji">${q.emoji}</div><h2>${q.q}</h2><div class="choices">${q.choices.map((c,j)=>`<button class="choice" data-j="${j}">${c}</button>`).join('')}</div><p id="feedback"></p></div>`;next.classList.add('hidden');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.j));}
async function answer(j){let q=current[i],ok=j===q.correct;answers.push({...q,answer:q.choices[j],correctAnswer:q.choices[q.correct],correct:ok});if(ok)score++;profile.skills??={};profile.skills[q.skill]??={a:0,c:0};profile.skills[q.skill].a++;if(ok)profile.skills[q.skill].c++;profile.done=(profile.done||0)+1;profile.stars=(profile.stars||0)+(ok?2:0);save();document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('correct');if(n===j&&!ok)b.classList.add('wrong')});feedback.textContent=ok?'🎉 Bravo !':'💪 On réessaie la prochaine fois !';next.classList.remove('hidden');stats();fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:q.skill,subject:q.subject,question:q.q,answer:q.choices[j],correctAnswer:q.choices[q.correct],correct:ok,difficulty:q.difficulty})}).catch(()=>{});}
next.onclick=()=>{i++;if(i<current.length)show();else finish()};function finish(){quiz.innerHTML=`<div style="text-align:center"><h2>🎉 Bravo !</h2><p>Tu as obtenu <b>${score}/${current.length}</b>.</p><button onclick="location.reload()">Retour à mes exercices</button></div>`;}
quit.onclick=()=>location.reload();document.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(b.dataset.cat));missionBtn.onclick=()=>start('evaluation');parentBtn.onclick=()=>{modal.style.display='flex';};closeLogin.onclick=()=>modal.style.display='none';loginBtn.onclick=async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok){login.classList.add('hidden');parent.classList.remove('hidden');loadParent()}else loginError.textContent='Mot de passe incorrect.'};logout.onclick=async()=>{await fetch('/api/login',{method:'DELETE'});location.reload()};
let parentResults=[];async function loadParent(){const r=await fetch('/api/results');if(!r.ok){loginError.textContent='Impossible de charger les résultats.';return}parentResults=(await r.json()).results||[];const total=parentResults.length,correct=parentResults.filter(x=>x.correct).length;parentStats.innerHTML=`<p><b>${total}</b> réponses enregistrées · <b>${total?Math.round(correct/total*100):0}%</b> de réussite</p>`+parentResults.slice(0,30).map(x=>`<div class="result">${new Date(x.createdAt).toLocaleString()} · <b>${N[x.skill]||x.skill}</b> · ${x.correct?'✅':'❌'} ${x.answer}</div>`).join('')};export.onclick=()=>{const blob=new Blob([JSON.stringify(parentResults,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aylan-resultats.json';a.click()};prompt.onclick=()=>qwenPrompt.textContent=`Tu es un assistant pédagogique pour un enfant de 7 ans. Analyse cet historique d’exercices. Identifie les compétences solides et celles à renforcer. Propose une mission de 7 jours avec des exercices adaptés. Ne change jamais directement les niveaux : le moteur du site reste décisionnaire.\n\nHISTORIQUE:\n${JSON.stringify(parentResults,null,2)}`;
stats();
</script></body></html>
