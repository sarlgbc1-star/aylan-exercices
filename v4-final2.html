<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les aventures d’Aylan — V4+</title>
<style>
:root{--ink:#203b4c;--sky:#62c7e8;--blue:#238bc1;--green:#62c978;--red:#f06b62;--yellow:#ffd15c;--bg:#f4fafd}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--sky) 0 190px,var(--bg) 190px);min-height:100vh}header{text-align:center;color:#fff;padding:28px 15px 52px}h1{margin:0;font-size:clamp(2rem,7vw,3rem)}main{max-width:1000px;margin:-24px auto 40px;padding:0 14px}.panel{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 18px #203b4c18}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid,.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{border:0;border-radius:18px;padding:20px;background:#fff;box-shadow:0 5px 15px #203b4c18;cursor:pointer;color:var(--ink);font:inherit;text-align:left}.card span{font-size:2.2rem}.card b{display:block;font-size:1.1rem;margin:8px 0}.skill{background:var(--bg);padding:14px;border-radius:14px}.bar{height:9px;background:#dceaf2;border-radius:8px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--green)}button{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer;font-size:1rem}.secondary{background:#e7edf1;color:var(--ink)}.hidden{display:none!important}.quiz{text-align:center}.emoji{font-size:4rem}.choices{display:grid;gap:12px;max-width:650px;margin:20px auto}.choice{background:var(--bg);color:var(--ink);border:3px solid #dceaf2}.choice.correct{background:#e4f8e8!important;border-color:var(--green)!important}.choice.wrong{background:#fdeaea!important;border-color:var(--red)!important}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7edf1;font-size:.85rem;margin:2px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.feedback{font-size:1.1rem;min-height:30px;margin-top:12px}.small{color:#587383;font-size:.92rem}.mission{border-left:6px solid var(--yellow);background:#fffaf0;padding:14px;border-radius:12px}.result{text-align:center}.big{font-size:3rem}
</style></head>
<body><header><h1>Les aventures d’Aylan 🚀</h1><p>V4+ — plus de variété, un défi qui monte avec les progrès</p></header><main>
<section class="panel top"><strong>⭐ <span id="stars">0</span></strong><span>Réponses : <b id="done">0</b></span><button class="secondary" onclick="location.href='/'">⬅ Retour V3.1</button></section>
<section class="panel"><h2>📊 Mon profil</h2><div id="profile" class="skills"></div></section>
<section class="panel"><h2>🎯 Mission du jour</h2><div id="mission" class="mission"></div><div class="actions"><button onclick="mission()">Commencer 🚀</button></div></section>
<section id="home" class="grid"></section>
<section id="quiz" class="panel hidden"><div class="top"><span id="progress"></span><span id="level"></span><button class="secondary" onclick="home()">⬅ Quitter</button></div><div id="question" class="quiz"></div><div class="actions"><button id="next" class="hidden" onclick="next()">Suivant ➜</button></div></section>
<section id="result" class="panel hidden result"></section></main>
<script>
'use strict';
const SK={addition:'Addition',soustraction:'Soustraction',suites:'Suites numériques',comparaison:'Comparaison',mots_ar:'Mots arabes',lettres_ar:'Lettres arabes',vocab_ar:'Vocabulaire arabe',mots_fr:'Mots français',lecture_fr:'Lecture française',vocab_fr:'Vocabulaire français',mots_en:'Mots anglais',couleurs_en:'Couleurs anglaises',comprehension_en:'Compréhension anglaise',logique:'Logique'};
const CAT={evaluation:['📋','Évaluation','Une question par compétence'],calcul:['🔢','Calcul','Nombres et opérations'],arabe:['📖','العربية','Mots, lettres et vocabulaire'],francais:['📚','Français','Mots, lecture et vocabulaire'],anglais:['🔤','English','Words, colors and meaning'],logique:['🧩','Logique','Réfléchir et trouver la règle']};
const BANK={
mots_ar:[['🐱','Quel mot signifie « chat » ?',['قطة','كلب','بيت'],'قطة'],['🐶','Quel mot signifie « chien » ?',['بيت','كلب','شجرة'],'كلب'],['🏠','Quel mot signifie « maison » ?',['باب','بيت','قلم'],'بيت'],['🌳','Quel mot signifie « arbre » ?',['شجرة','قمر','كتاب'],'شجرة'],['📖','Quel mot signifie « livre » ?',['كرسي','كتاب','باب'],'كتاب'],['🚪','Quel mot signifie « porte » ?',['باب','بحر','قمر'],'باب'],['🌙','Quel mot signifie « lune » ?',['شمس','قمر','بيت'],'قمر'],['🌊','Quel mot signifie « mer » ?',['بحر','قلم','كتاب'],'بحر']],
lettres_ar:[['✏️','Première lettre de « قلم » ?',['ق','ل','م'],'ق'],['📖','Première lettre de « كتاب » ?',['ت','ك','ب'],'ك'],['🐱','Première lettre de « قطة » ?',['ط','ة','ق'],'ق'],['🏠','Première lettre de « بيت » ?',['ب','ت','ي'],'ب'],['🌙','Première lettre de « قمر » ?',['ر','م','ق'],'ق'],['🌳','Première lettre de « شجرة » ?',['ش','ج','ر'],'ش'],['☀️','Première lettre de « شمس » ?',['س','ش','م'],'ش'],['🚪','Première lettre de « باب » ?',['ب','ا','د'],'ب']],
vocab_ar:[['☀️','Choisis « soleil » en arabe.',['قمر','شمس','نجمة'],'شمس'],['🌙','Choisis « lune » en arabe.',['شمس','قمر','بحر'],'قمر'],['🚪','Choisis « porte » en arabe.',['باب','بيت','قلم'],'باب'],['📚','Choisis « livre » en arabe.',['كرسي','كتاب','شجرة'],'كتاب'],['🌊','Choisis « mer » en arabe.',['بحر','باب','قمر'],'بحر'],['🌳','Choisis « arbre » en arabe.',['شجرة','باب','قمر'],'شجرة'],['🐟','Choisis « poisson » en arabe.',['سمكة','قطة','بيت'],'سمكة'],['☁️','Choisis « nuage » en arabe.',['مطر','سحاب','بحر'],'سحاب']],
mots_fr:[['🐱','Quel mot correspond à l’animal ?',['chat','chien','oiseau'],'chat'],['🐶','Quel mot correspond à l’animal ?',['poisson','chien','chat'],'chien'],['🍎','Quel mot correspond au fruit ?',['maison','pomme','table'],'pomme'],['🏠','Quel mot correspond au bâtiment ?',['maison','soleil','livre'],'maison'],['📖','Quel mot correspond à ce qu’on lit ?',['chaise','livre','arbre'],'livre'],['🚲','Quel mot correspond au moyen de transport ?',['vélo','table','banane'],'vélo'],['🐟','Quel mot correspond à l’animal ?',['poisson','maison','pomme'],'poisson'],['🌳','Quel mot correspond à la plante ?',['arbre','chaise','livre'],'arbre']],
lecture_fr:[['🔤','Première lettre de « livre » ?',['l','v','b'],'l'],['🔤','Première lettre de « maison » ?',['m','s','n'],'m'],['🔤','Première lettre de « école » ?',['c','é','l'],'é'],['🔤','Première lettre de « bateau » ?',['b','t','e'],'b'],['🔤','Première lettre de « soleil » ?',['s','o','l'],'s'],['🔤','Première lettre de « voiture » ?',['v','t','r'],'v'],['🔤','Première lettre de « jardin » ?',['j','d','g'],'j'],['🔤','Première lettre de « chocolat » ?',['c','h','t'],'c']],
vocab_fr:[['☀️','Contraire de « nuit » ?',['jour','soir','pluie'],'jour'],['🐘','Quel animal est le plus grand ?',['souris','éléphant','fourmi'],'éléphant'],['🍋','Quel goût a généralement un citron ?',['sucré','salé','acide'],'acide'],['🔥','Quel mot décrit quelque chose de très chaud ?',['froid','brûlant','mouillé'],'brûlant'],['🌧️','Que voit-on tomber quand il pleut ?',['neige','pluie','sable'],'pluie'],['🧊','Quel est le contraire de « chaud » ?',['froid','sec','grand'],'froid'],['🐢','Quel animal avance généralement lentement ?',['guépard','tortue','aigle'],'tortue'],['🌙','Quel moment vient après le soir ?',['matin','midi','après-midi'],'matin']],
mots_en:[['🐱','English word for « chat »?',['dog','cat','bird'],'cat'],['🐶','English word for « chien »?',['dog','fish','house'],'dog'],['🍎','English word for « pomme »?',['apple','car','book'],'apple'],['🏠','English word for « maison »?',['tree','house','sun'],'house'],['📖','English word for « livre »?',['chair','book','door'],'book'],['🐟','English word for « poisson »?',['fish','dog','tree'],'fish'],['🚗','English word for « voiture »?',['car','house','bird'],'car'],['🌳','English word for « arbre »?',['tree','sun','chair'],'tree']],
couleurs_en:[['🔴','What color is red?',['blue','green','red'],'red'],['🔵','What color is blue?',['blue','yellow','black'],'blue'],['🟢','What color is green?',['green','red','white'],'green'],['🟡','What color is yellow?',['purple','yellow','brown'],'yellow'],['⚫','What color is black?',['orange','pink','black'],'black'],['🟣','What color is purple?',['purple','green','blue'],'purple'],['🟠','What color is orange?',['orange','black','pink'],'orange'],['⚪','What color is white?',['brown','white','red'],'white']],
comprehension_en:[['🐱','The cat is small. Is the cat small?',['Yes','No','I don’t know'],'Yes'],['☀️','The sun is yellow. What color is the sun?',['blue','yellow','green'],'yellow'],['🍎','A boy eats an apple. What does he eat?',['a car','an apple','a book'],'an apple'],['🐶','The dog runs fast. What animal runs?',['the cat','the dog','the bird'],'the dog'],['🏠','The house is big. Is the house big?',['Yes','No','Maybe'],'Yes'],['🐦','The bird is in the tree. Where is the bird?',['in the tree','in the car','in the house'],'in the tree'],['🍌','The girl eats a banana. What does she eat?',['an apple','a banana','a dog'],'a banana'],['🌧️','It is raining. What is falling?',['rain','snow','sand'],'rain']]
};
let state={skills:{},stars:0,done:0};try{state=JSON.parse(localStorage.getItem('aylanV4')||'{}')}catch(e){}state.skills??={};state.stars??=0;state.done??=0;const $=id=>document.getElementById(id);let current=[],pos=0,answered=false,cat='';
function ensure(k){return state.skills[k]??={attempts:0,correct:0,recent:[],streak:0,bestStreak:0,due:null,errorTypes:{}}}
function score(k){let s=ensure(k);if(!s.attempts)return 0;let a=100*s.correct/s.attempts,r=s.recent.length?100*s.recent.filter(Boolean).length/s.recent.length:a,c=s.bestStreak>=4?10:s.bestStreak>=2?5:0;return Math.round(Math.min(100,a*.65+r*.25+c))}
function lvl(k){let p=score(k);return p<40?1:p<60?2:p<80?3:4}function ln(n){return ['','🔴 Découverte','🟠 En progression','🟡 Maîtrise','🟢 Avancé'][n]}
function shuffle(a){return a.sort(()=>Math.random()-.5)}function unique(arr){return [...new Set(arr.map(String))]}
function nums(k,l){let max=l===1?20:l===2?50:l===3?100:200, a,b,ans,text;
 if(k==='addition'){a=rand(max);b=rand(max);ans=a+b;text=`${a} + ${b} = ?`}
 if(k==='soustraction'){a=rand(max);b=rand(a+1);ans=a-b;text=`${a} − ${b} = ?`}
 if(k==='suites'){let start=rand(l===1?20:l===2?50:100)+1,step=rand(l===1?3:l===2?6:10)+1;ans=start+step*3;text=`${start}, ${start+step}, ${start+step*2}, ?`}
 if(k==='comparaison'){a=rand(max)+1;b=rand(max)+1;if(a===b)b++;ans=Math.max(a,b);text='Quel est le plus grand ?'}
 let d=l===1?[1,-1,2]:l===2?[1,-1,2,-2,5,-5]:l===3?[1,-1,3,-3,5,-5,10,-10]:[1,-1,4,-4,7,-7,10,-10];let vals=new Set([ans]);while(vals.size<3){let x=ans+d[rand(d.length)];if(x>=0)vals.add(x)}return {emoji:k==='addition'?'➕':k==='soustraction'?'➖':'🔢',text,choices:shuffle([...vals].map(String)),answer:String(ans)} }
function rand(n){return Math.floor(Math.random()*n)}
function logic(l){let start=rand(10)+1,step=l>=3?rand(8)+2:rand(4)+1,ans=start+step*3;return {emoji:'🧩',text:`Trouve le nombre suivant : ${start}, ${start+step}, ${start+step*2}, ?`,choices:shuffle([String(ans),String(ans+step),String(ans-step)]),answer:String(ans)}}
function bankq(k){let x=BANK[k][rand(BANK[k].length)];return {emoji:x[0],text:x[1],choices:shuffle([...x[2]]),answer:x[3]}}
function make(k){let l=lvl(k);return ['addition','soustraction','suites','comparaison'].includes(k)?nums(k,l):k==='logique'?logic(l):bankq(k)}
function fresh(k,used){for(let i=0;i<30;i++){let q=make(k),sig=q.text+'|'+q.answer;if(!used.has(sig))return q}return make(k)}
function build(k,n=6){let used=new Set();return Array.from({length:n},()=>{let q=fresh(k,used);used.add(q.text+'|'+q.answer);return q})}
function render(){document.getElementById('stars').textContent=state.stars;document.getElementById('done').textContent=state.done;document.getElementById('profile').innerHTML=Object.entries(SK).map(([k,n])=>{let s=ensure(k),p=score(k);return `<div class="skill"><b>${n}</b><div><span class="tag">${ln(lvl(k))}</span><span class="tag">${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="small">${s.attempts} essais · ${s.correct} réussites</div></div>`}).join('');let weak=choose();document.getElementById('mission').innerHTML=`<b>${SK[weak]}</b> — ${ln(lvl(weak))}<br><span class="small">La mission cible ta compétence la plus faible et augmente progressivement la difficulté.</span>`;document.getElementById('home').innerHTML=Object.entries(CAT).map(([k,v])=>`<button class="card" onclick="start('${k}')"><span>${v[0]}</span><b>${v[1]}</b><small>${v[2]}</small></button>`).join('')}
function choose(){return Object.keys(SK).sort((a,b)=>{let A=ensure(a),B=ensure(b);if(!A.attempts&&!B.attempts)return 0;if(!A.attempts)return -1;if(!B.attempts)return 1;return score(a)-score(b)})[0]}
function start(c,forced){cat=c;let skills=forced?[forced]:c==='calcul'?['addition','soustraction','suites','comparaison']:c==='arabe'?['mots_ar','lettres_ar','vocab_ar']:c==='francais'?['mots_fr','lecture_fr','vocab_fr']:c==='anglais'?['mots_en','couleurs_en','comprehension_en']:c==='logique'?['logique']:Object.keys(SK);current=[];let used=new Set();if(c==='evaluation'){skills.forEach(k=>{let q=fresh(k,used);used.add(q.text+'|'+q.answer);current.push(q)})}else{for(let i=0;i<6;i++){let k=skills[i%skills.length],q=fresh(k,used);q.skill=k;used.add(q.text+'|'+q.answer);current.push(q)}}pos=0;answered=false;document.getElementById('quiz').classList.remove('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('home').classList.add('hidden');show()}
function mission(){start('mission',choose())}
function show(){let q=current[pos];document.getElementById('progress').textContent=`Question ${pos+1}/${current.length}`;document.getElementById('level').textContent=q.skill?`${SK[q.skill]} · ${ln(lvl(q.skill))}`:'';document.getElementById('question').innerHTML=`<div class="emoji">${q.emoji}</div><h2>${q.text}</h2><div class="choices">${q.choices.map((x,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})">${x}</button>`).join('')}</div><div id="fb" class="feedback"></div>`;document.getElementById('next').classList.add('hidden');answered=false}
function answer(i){if(answered)return;answered=true;let q=current[pos],ok=String(q.choices[i])===String(q.answer),k=q.skill||infer(q);if(!k)k=choose();let s=ensure(k);s.attempts++;s.recent=(s.recent||[]).slice(-7);s.recent.push(ok);if(ok){s.correct++;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak);state.stars+=2}else{s.streak=0;s.errorTypes={...(s.errorTypes||{}),generic:(s.errorTypes?.generic||0)+1}}state.done++;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(String(q.choices[j])===String(q.answer))b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('fb').innerHTML=ok?'✅ Bravo !':'❌ Pas cette fois. La bonne réponse est <b>'+q.answer+'</b>.';document.getElementById('next').classList.remove('hidden');localStorage.setItem('aylanV4',JSON.stringify(state));render()}
function infer(q){for(let k of Object.keys(BANK))if(BANK[k].some(x=>x[1]===q.text))return k;for(let k of ['addition','soustraction','suites','comparaison','logique'])if(q.text.includes(k==='addition'?'+':k==='soustraction'?'−':'?'))return k;return null}
function next(){if(pos<current.length-1){pos++;show()}else finish()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('result').innerHTML=`<div class="big">🎉</div><h2>Série terminée !</h2><p>Tu peux recommencer avec une nouvelle série : les questions déjà posées sont évitées autant que possible.</p><button onclick="home()">Retour au menu</button>`}
function home(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('home').classList.remove('hidden');render()}
render();
</script></body></html>
